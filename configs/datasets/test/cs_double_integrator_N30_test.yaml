# Covariance-steering SDP subproblems for double integrator SCP (held-out test set)
---

device: cuda
precision: double
seed: 1

save_path: datasets/cs_double_integrator_N30/test100
n_problems: 100

problem_generator: cs_double_integrator
fixed_kwargs:
  N: 30
  dt: 0.5
  sigma_a: 0.1
  sigma_0: 0.01
  sigma_N: 0.25
  scp_max_iters: 1
  scp_kkt_tol: 1.0e-3

solver: clarabel
solver_kwargs:
  max_iter: 1000
  conv_tol: 1.0e-10
  verbose: false
