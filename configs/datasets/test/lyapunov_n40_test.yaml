# Lyapunov LMI SDPs (held-out test set)
---

device: cuda
precision: double
seed: 1

save_path: datasets/lyapunov_n40/test100
n_problems: 100

problem_generator: lyapunov_lmi
equilibrate: true
fixed_kwargs:
  n: 40
  generator: mixed
  spectral_margin: 0.05
  schur_offdiag_scale: 0.1
  layout: csr

solver: clarabel
solver_kwargs:
  max_iter: 1000
  conv_tol: 1.0e-10
  verbose: false
