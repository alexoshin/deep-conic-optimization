# Lovasz theta SDPs (held-out test set)
---

device: cuda
precision: double
seed: 1

save_path: datasets/lovasz_theta_n100/test100
n_problems: 100

problem_generator: lovasz_theta
fixed_kwargs:
  n: 100
  edge_density: 0.5
  layout: csr

solver: clarabel
solver_kwargs:
  max_iter: 1000
  conv_tol: 1.0e-10
  verbose: false
