# Covariance-steering SDP subproblems for unicycle SCP (held-out test set)
---

device: cuda
precision: double
seed: 1

save_path: datasets/cs_unicycle_N30/test100
n_problems: 10  # 10 scenarios x 10 SCP iterations = 100 subproblem instances

problem_generator: cs_unicycle
fixed_kwargs:
  N: 30
  dt: 0.1
  scp_max_iters: 10
  scp_trust_x0: 5.0
  scp_trust_u0: 5.0
  scp_kkt_tol: 1.0e-10

solver: clarabel_scp
solver_kwargs:
  max_iter: 1000
  conv_tol: 1.0e-10
  verbose: false
